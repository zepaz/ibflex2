repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: debug-statements
    -   id: double-quote-string-fixer
    -   id: name-tests-test
    -   id: requirements-txt-fixer
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types: [python]
    -   id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types: [python]
    -   id: mypy
        name: mypy check
        entry: mypy ibflex tests --config-file=./pyproject.toml
        language: system
        types: [python]
